# Each day, moves the rpi pins to the newest upstream release (deploy/bump-rpi.sh) and tests it as
# deploy/release.sh does: fmt, clippy, the tests, and the ignored tests against the new binary
# itself. Green, the bump is merged into main; red, its PR stays open with the failing run linked,
# for a person to fix. A manual run can name a version: `gh workflow run rpi-bump.yml -f version=0.22.0`.
# Merging does not release: tag as usual (README "Releasing") to publish an image with the new rpi.
# Needs, in the repo's Settings > Actions > General, "Allow GitHub Actions to create and approve pull
# requests". If main requires status checks, a PR opened with GITHUB_TOKEN starts no ci run, so set
# secret RPI_BUMP_TOKEN (a fine-grained token with contents and pull-requests write on this repo) to
# have ci run on the PR, and the merge then waits for it (`--auto`, with auto-merge allowed).
# Two jobs, so the token that can push here never shares a machine with the code the bump brings
# (the new rpi crates' build scripts run in the tests): `build` bumps and tests with no token and
# hands on its diff; `push`, on a fresh GitHub-hosted runner, checks that the diff moves nothing but
# the pins (.github/bump-check.py), applies it, pushes, opens the PR and merges. It never runs cargo
# or anything the build made. `build` follows variable ZEPHYR_CI as ci.yml does (.github/ci.sh
# plan, README "CI"): on zephyr-local, unless that is `hosted`. `push` is hosted only: when GitHub
# will not start it (quota, spending limit) it fails and the bump waits for the next day's run.
name: rpi-bump
on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "rpi version (default: the latest)"
        required: false
permissions:
  contents: read
concurrency: rpi-bump
jobs:
  plan:
    runs-on: ${{ vars.ZEPHYR_CI == 'hosted' && 'ubuntu-latest' || 'zephyr-local' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      runner: ${{ steps.plan.outputs.local }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        run: .github/ci.sh plan
        env:
          GH_TOKEN: ${{ github.token }}
          ZEPHYR_CI: ${{ vars.ZEPHYR_CI }}
  # No token in any step: what it hands on is its diff, which `push` checks before using it.
  build:
    needs: plan
    runs-on: ${{ needs.plan.outputs.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ steps.bump.outputs.version }}
      old: ${{ steps.bump.outputs.old }}
      tested: ${{ steps.test.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: bump
        run: deploy/bump-rpi.sh "$VERSION"
        env:
          VERSION: ${{ inputs.version }}
          RPI_BUMP_DIR: ${{ runner.temp }}/rpi
      # Taken and uploaded before the tests run anything the bump brought.
      - if: steps.bump.outputs.version != ''
        run: git diff --no-color --no-ext-diff > "$RUNNER_TEMP/bump.patch"
      - if: steps.bump.outputs.version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpi-bump
          path: ${{ runner.temp }}/bump.patch
          if-no-files-found: error
          retention-days: 7
      - if: runner.environment == 'github-hosted' && steps.bump.outputs.version != ''
        uses: dtolnay/rust-toolchain@1.95
        with:
          components: rustfmt, clippy
      - if: runner.environment == 'github-hosted' && steps.bump.outputs.version != ''
        uses: Swatinem/rust-cache@v2
      - if: runner.environment == 'github-hosted' && steps.bump.outputs.version != ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux
      - id: test
        if: steps.bump.outputs.version != ''
        env:
          RPI_BIN: ${{ steps.bump.outputs.rpi }}
          ZEPHYR_REAL_RPI: "1"
          # The runner empties its temp dir before each job; zephyr-local's /tmp would only grow.
          TMPDIR: ${{ runner.temp }}
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test --workspace
          cargo test --workspace -- --ignored
  # The one job with a token that can push: a fresh GitHub-hosted runner, never zephyr-local, whose
  # disk keeps what earlier jobs' build scripts left there; nothing rescues it onto zephyr-local.
  # GH_TOKEN is only on the steps that talk to GitHub (tests/host.rs
  # no_step_that_runs_cargo_holds_a_github_token).
  push:
    needs: build
    if: always() && needs.build.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    # The build's outputs: read only through the environment, and checked before anything uses them.
    env:
      V: ${{ needs.build.outputs.version }}
      OLD: ${{ needs.build.outputs.old }}
      TESTED: ${{ needs.build.outputs.tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rpi-bump
          path: ${{ runner.temp }}/bump
      # The allowlist: only the files bump-rpi.sh edits (ALLOWED in .github/bump-check.py, run from
      # this job's own checkout), and in them only the rpi version and the Dockerfile's rpi sha256s.
      - run: python3 -I .github/bump-check.py "$OLD" "$V" "$RUNNER_TEMP/bump/bump.patch"
      # An open PR for this version that already failed stays as it is until a person acts on it.
      - id: pr
        env:
          GH_TOKEN: ${{ secrets.RPI_BUMP_TOKEN || github.token }}
        run: |
          branch=rpi-bump/v$V
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "open=$(gh pr list --head "$branch" --state open --json number --jq length)" >> "$GITHUB_OUTPUT"
      - if: steps.pr.outputs.open == '0'
        run: git apply "$RUNNER_TEMP/bump/bump.patch"
      - id: push
        if: steps.pr.outputs.open == '0'
        env:
          GH_TOKEN: ${{ secrets.RPI_BUMP_TOKEN || github.token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -qam "chore(rpi): move the rpi pins from $OLD to $V"
          # The token from the env, as the checkout kept none.
          git push -f "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$BRANCH"
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$TESTED" = success ]; then
            result="fmt, clippy, the tests and the ignored tests against rpi $V passed ([run]($run))."
          else
            result="**Not merged**: the checks against rpi $V failed ([run]($run)). Fix them on this branch."
          fi
          gh pr create --base main --head "$BRANCH" --title "chore(rpi): move the rpi pins from $OLD to $V" --body "$(printf '%s\n\n%s\n\n%s' \
            "Moves every rpi pin (Dockerfile version and sha256s, RPI_PIN, the Cargo pins, fake-rpi's version, the real-rpi test path) from $OLD to $V with deploy/bump-rpi.sh." \
            "$result" \
            "Release notes: https://github.com/bigfish1913/pi-rust/releases/tag/v$V")"
      - if: env.TESTED == 'success' && steps.push.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.RPI_BUMP_TOKEN || github.token }}
          AUTO: ${{ secrets.RPI_BUMP_TOKEN != '' }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          if [ "$AUTO" = true ]; then
            gh pr merge "$BRANCH" --squash --delete-branch --auto
          else
            gh pr merge "$BRANCH" --squash --delete-branch
          fi
