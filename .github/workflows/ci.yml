# Two checks on every PR and push to main, each compiling once: lint (shellcheck, fmt, cargo deny,
# clippy) and test (the whole suite), on the owner's runners (zephyr-local, deploy/runner/start.sh)
# seeded from main's last build; `ci-ok` is the one check to gate merges on (README "CI").
# .github/ci.sh holds the placement, the checks and when none are needed (only Markdown outside the
# code changed, or main's merge of a PR whose head passed on the same tree).
# Variable ZEPHYR_CI: unset or `both` runs the nightly run's test on GitHub-hosted and everything
# else on zephyr-local; `local` runs everything there, `hosted` everything on GitHub (the server is
# down).
# The ignored tests need the pinned rpi binary: deploy/release.sh runs them.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  # Nightly on main, so GitHub's runner tests the code even on days nothing is merged.
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
# A PR's newer push cancels its older run; a push to main and the nightly run are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: never
jobs:
  plan:
    runs-on: ${{ vars.ZEPHYR_CI == 'hosted' && 'ubuntu-latest' || 'zephyr-local' }}
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      rescue: ${{ steps.plan.outputs.rescue }}
      skip: ${{ steps.skip.outputs.skip }}
    steps:
      # Depth 2: the parent (for a PR, the base its merge commit sits on) says what changed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: plan
        run: .github/ci.sh plan
        env:
          GH_TOKEN: ${{ github.token }}
          ZEPHYR_CI: ${{ vars.ZEPHYR_CI }}
      - id: skip
        run: .github/ci.sh skip
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
  check:
    needs: plan
    if: needs.plan.outputs.skip == ''
    name: ${{ matrix.check }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # zephyr-local's image (deploy/runner/Dockerfile) has all of this; GitHub's runners get it here.
      # The toolchain the image builds with (deploy/Dockerfile's rust:1.95), so a newer clippy's lints
      # land with a deliberate bump, not on an unrelated PR.
      - if: runner.environment == 'github-hosted'
        uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
        with:
          components: rustfmt, clippy
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ matrix.check }}
      - if: runner.environment == 'github-hosted'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.146,cargo-deny@0.20.2
      # tests/tui.rs drives tmux and skips without it; script, python3 and node come with the runner.
      - if: runner.environment == 'github-hosted' && matrix.check == 'test'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux
      - run: .github/ci.sh run "$CHECK"
        env:
          CHECK: ${{ matrix.check }}
  # A hosted job GitHub would not start (spending limit or quota) runs here instead; one that ran and
  # failed is never rescued.
  rescue:
    needs: [plan, check]
    if: ${{ !cancelled() && needs.plan.outputs.rescue == 'true' && needs.check.result == 'failure' }}
    runs-on: zephyr-local
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Two steps, so the token is never in the environment of a process that builds the branch:
      # this one only asks the Actions API which checks to rescue. It runs the branch's own
      # ci.sh with the token, on purpose: only the owner pushes branches to this private repo, the
      # token reads only (actions, checks, contents), and a branch could as well edit this file.
      # What the split keeps out is third-party code, the crates' build scripts, which never run
      # in this step.
      - id: which
        run: .github/ci.sh rescue-plan
        env:
          GH_TOKEN: ${{ github.token }}
      - run: .github/ci.sh rescue
        env:
          CHECKS: ${{ steps.which.outputs.checks }}
  ci-ok:
    needs: [plan, check, rescue]
    # A superseded run, cancelled, posts no failed ci-ok.
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.ZEPHYR_CI == 'hosted' && 'ubuntu-latest' || 'zephyr-local' }}
    timeout-minutes: 5
    steps:
      - run: |
          echo "plan: $PLAN, checks: $CHECK, rescue: $RESCUE"
          if [ "$PLAN" = success ] && [ -n "$SKIP" ] && [ "$CHECK" = skipped ]; then
            echo "ci-ok without checks: $SKIP" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$PLAN" = success ] && { [ "$CHECK" = success ] || [ "$RESCUE" = success ]; }
        env:
          PLAN: ${{ needs.plan.result }}
          CHECK: ${{ needs.check.result }}
          RESCUE: ${{ needs.rescue.result }}
          SKIP: ${{ needs.plan.outputs.skip }}
