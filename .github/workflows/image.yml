# Publishes ghcr.io/<this repository>:<version> and :latest for each v* tag (here
# ghcr.io/yansigit/zephyr; a fork publishes to its own); `zephyr init` and `zephyr upgrade` pull it.
# The name also goes in as build arg ZEPHYR_BUILD_REPO, so the image's CLI upgrades from where it came.
# A manual run (`gh workflow run image.yml --ref <branch>`) builds :dev without pushing anything;
# with `-f providers=none` it builds :dev-minimal, the image without the owner's provider sources
# (both repo args empty, DESIGN §4.4 item 1), also never pushed.
# Secret PROVIDER_REPOS_TOKEN: a fine-grained token with contents:read on yansigit/rpi-package and
# yansigit/rpi-provider-plugins, passed to the build as the gh_token secret. It is only needed while
# one of them is private; the build works without it when both are public.
# Where it runs follows variable ZEPHYR_CI as ci.yml does (.github/ci.sh plan, README "CI"): on
# GitHub-hosted, unless that is `local` or GitHub refused a hosted job in the last hours; then on
# zephyr-local (deploy/runner/start.sh), which builds on its zephyr-buildkitd without the smoke test;
# `-f local=true` builds there whatever ZEPHYR_CI says.
name: image
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      # A tag push has no inputs: empty reads as full.
      providers:
        description: "full: every provider source; none: without the owner's provider repos"
        type: choice
        default: full
        options: [full, none]
      local:
        description: "build on zephyr-local whatever ZEPHYR_CI says"
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
  actions: read
jobs:
  plan:
    runs-on: ${{ vars.ZEPHYR_CI == 'hosted' && 'ubuntu-latest' || 'zephyr-local' }}
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.plan.outputs.hosted }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        run: .github/ci.sh plan
        env:
          GH_TOKEN: ${{ github.token }}
          ZEPHYR_CI: ${{ vars.ZEPHYR_CI }}
  image:
    needs: plan
    runs-on: ${{ inputs.local && 'zephyr-local' || needs.plan.outputs.runner }}
    # A hung build fails after 90 minutes instead of burning GitHub's 6-hour limit in minutes; a cold
    # build (no cache, as after a base image moves) takes about an hour on a hosted runner.
    timeout-minutes: 90
    env:
      MINIMAL: ${{ inputs.providers == 'none' }}
    steps:
      # GitHub's runners have ~14 GB free, too little for this image's build; their preinstalled
      # SDKs free ~30 GB more. df shows the room in the log either way.
      - if: runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: |
          case $GITHUB_REF in refs/tags/v*) v=${GITHUB_REF_NAME#v} ;; *) v=dev ;; esac
          if [ "$MINIMAL" = true ]; then v=dev-minimal; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      # The registry login and buildx's builder record live in a folder of this job's own, removed
      # at its end, never in the runner's home.
      - run: echo "DOCKER_CONFIG=$(mktemp -d)" >> "$GITHUB_ENV"
      - if: runner.environment == 'github-hosted'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The last step removes $DOCKER_CONFIG, which holds the builder's record, before the
          # actions' own cleanup would run; and the runner is thrown away.
          cleanup: false
      # zephyr-buildkitd answers only this client certificate (mTLS, deploy/runner/start.sh), which
      # no other workflow is given: a test job on zephyr-local reaches the daemon but cannot use it.
      - if: runner.environment == 'self-hosted'
        env:
          CA: ${{ secrets.BUILDKIT_CA }}
          CERT: ${{ secrets.BUILDKIT_CERT }}
          KEY: ${{ secrets.BUILDKIT_KEY }}
        run: |
          d=$(mktemp -d)
          (umask 077; printf '%s\n' "$CA" > "$d/ca.pem"; printf '%s\n' "$CERT" > "$d/cert.pem"; printf '%s\n' "$KEY" > "$d/key.pem")
          echo "BUILDKIT_TLS=$d" >> "$GITHUB_ENV"
      - if: runner.environment == 'self-hosted'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: remote
          endpoint: tcp://zephyr-buildkitd:1234
          driver-opts: |
            cacert=${{ env.BUILDKIT_TLS }}/ca.pem
            cert=${{ env.BUILDKIT_TLS }}/cert.pem
            key=${{ env.BUILDKIT_TLS }}/key.pem
            servername=zephyr-buildkitd
          cleanup: false
      # No daemon needed: when `docker login` can't reach one, the CLI logs in client-side and still
      # writes $DOCKER_CONFIG/config.json, which buildx hands to the remote BuildKit for the push.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          # The login is in $DOCKER_CONFIG, which the last step removes.
          logout: false
      # Smoke test, hosted runners only: the fallback has no Docker daemon to load or run the image.
      - if: runner.environment == 'github-hosted'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: zephyr-smoke:ci
          # An empty line (the full image) is dropped.
          build-args: |
            ZEPHYR_BUILD_REPO=${{ steps.v.outputs.image }}
            ${{ env.MINIMAL == 'true' && 'RPI_PACKAGE_REPO=' || '' }}
            ${{ env.MINIMAL == 'true' && 'PLUGINS_REPO=' || '' }}
          secrets: |
            gh_token=${{ secrets.PROVIDER_REPOS_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The paths are the image's extensions (EXTENSIONS in crates/zephyr/src/host/conf.rs) and the policy plugin.
      - if: runner.environment == 'github-hosted' && env.MINIMAL != 'true'
        run: |
          docker run --rm zephyr-smoke:ci sh -c '
            set -e
            zephyr --version
            rpi --version
            test -x /usr/local/bin/zephyr
            test -f /usr/local/lib/libzephyr_policy.so
            test -f /opt/zephyr/ext/librpi_providers.so
            test -f /opt/zephyr/ext/librpi_mcp_adapter.so
            test -f /opt/zephyr/ext/libzephyr_cursor.so
            test -f /opt/zephyr/ext/rpi-claude-agent/librpi_claude_agent.so
          '
      # The minimal image: what stays, and none of what the two provider sources bring.
      - if: runner.environment == 'github-hosted' && env.MINIMAL == 'true'
        run: |
          docker run --rm zephyr-smoke:ci sh -c '
            set -e
            zephyr --version
            rpi --version
            test -x /usr/local/bin/zephyr
            test -f /usr/local/lib/libzephyr_policy.so
            test -f /opt/zephyr/ext/libzephyr_cursor.so
            test ! -e /opt/zephyr/ext/librpi_providers.so
            test ! -e /opt/zephyr/ext/librpi_mcp_adapter.so
            test ! -e /opt/zephyr/ext/rpi-claude-agent
          '
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          # A tag push only, and never the minimal image.
          push: ${{ startsWith(github.ref, 'refs/tags/v') && env.MINIMAL != 'true' }}
          # :latest only from a tag push, so a manual run on an old tag can't move it back.
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ github.event_name == 'push' && format('{0}:latest', steps.v.outputs.image) || '' }}
          build-args: |
            ZEPHYR_BUILD_REPO=${{ steps.v.outputs.image }}
            ${{ env.MINIMAL == 'true' && 'RPI_PACKAGE_REPO=' || '' }}
            ${{ env.MINIMAL == 'true' && 'PLUGINS_REPO=' || '' }}
          secrets: |
            gh_token=${{ secrets.PROVIDER_REPOS_TOKEN }}
          # Hosted runners only: the fallback's remote BuildKit runs outside the job, without an Actions cache token.
          cache-from: ${{ runner.environment == 'github-hosted' && 'type=gha' || '' }}
          cache-to: ${{ runner.environment == 'github-hosted' && 'type=gha,mode=max' || '' }}
          # A release built on zephyr-local's BuildKit uses none of its cache, which a branch's build
          # may have written.
          no-cache: ${{ runner.environment == 'self-hosted' && startsWith(github.ref, 'refs/tags/v') }}
      - if: always()
        run: rm -rf "$DOCKER_CONFIG" "${BUILDKIT_TLS:-}"
