# Publishes ghcr.io/yansigit/zephyr:<version> for each v* tag; `zephyr init` and `zephyr upgrade` pull it.
# Secret PROVIDER_REPOS_TOKEN: a fine-grained token with contents:read on yansigit/rpi-package and
# yansigit/rpi-provider-plugins, passed to the build as the gh_token secret. It is only needed while
# one of them is private; the build works without it when both are public.
name: image
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ghcr.io/yansigit/zephyr:${{ steps.v.outputs.version }}
          secrets: |
            gh_token=${{ secrets.PROVIDER_REPOS_TOKEN }}
