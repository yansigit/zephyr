about = "Brave Search: web, news, image and local search (@brave/brave-search-mcp-server 2.1.4, fetched by npx on first use)"
plain_reason = "brave-search sends its key in X-Subscription-Token, which zephyr swaps only in Authorization; the key spends search quota and reads nothing of yours"

[[secret]]
name = "BRAVE_API_KEY"
help = "a Brave Search API key: https://api-dashboard.search.brave.com/app/keys"

[server]
command = "npx"
args = ["-y", "@brave/brave-search-mcp-server@2.1.4"]
env = { BRAVE_API_KEY = "${BRAVE_API_KEY}" }
