about = "GitHub: issues, pull requests, code search (github/github-mcp-server 2.1.0, in the image)"

[[secret]]
name = "GITHUB_TOKEN"
help = "a fine-grained personal access token: https://github.com/settings/personal-access-tokens/new"

[server]
command = "/usr/local/bin/github-mcp-server"
args = ["stdio"]
env = { GITHUB_PERSONAL_ACCESS_TOKEN = "${GITHUB_TOKEN}" }
# Its REST, GraphQL and raw URLs (pkg/utils/api.go); uploads.github.com is release uploads only.
hosts = "api.github.com, raw.githubusercontent.com"

# What reaches other people or changes a repository where the tool's name does not say so
# (add_issue_comment, create_issue and create_pull_request already do), checked against 2.1.0's
# tool list, the granular and non-default toolsets included. Left out: reactions, stars and the
# owner's own notifications and pending reviews.
[server.classes]
issue_write = "posts"
sub_issue_write = "posts"
update_issue_comment = "posts"
update_pull_request = "posts"
merge_pull_request = "posts"
pull_request_review_write = "posts"
add_comment_to_pending_review = "posts"
create_gist = "posts"
update_gist = "posts"
create_repository = "posts"
fork_repository = "posts"
delete_repository = "posts"
push_files = "posts"
create_or_update_file = "posts"
delete_file = "posts"
create_branch = "posts"
update_pull_request_branch = "posts"
assign_copilot_to_issue = "posts"
assign_copilot_to_issue_with_intent = "posts"
request_copilot_review = "posts"
submit_pending_pull_request_review = "posts"
request_pull_request_reviewers = "posts"
update_pull_request_body = "posts"
update_pull_request_title = "posts"
update_pull_request_state = "posts"
update_pull_request_draft_state = "posts"
resolve_review_thread = "posts"
unresolve_review_thread = "posts"
update_issue_body = "posts"
update_issue_title = "posts"
update_issue_state = "posts"
update_issue_labels = "posts"
update_issue_assignees = "posts"
update_issue_milestone = "posts"
update_issue_type = "posts"
set_issue_fields = "posts"
add_sub_issue = "posts"
remove_sub_issue = "posts"
reprioritize_sub_issue = "posts"
issue_dependency_write = "posts"
label_write = "posts"
actions_run_trigger = "posts"
create_repository_ruleset = "posts"
custom_properties_write = "posts"
projects_write = "posts"
