about = "Linear: issues, projects and comments (Linear's own server, through mcp-remote 0.16.6, fetched by npx on first use)"

[[secret]]
name = "LINEAR_API_KEY"
help = "a personal API key: Linear, Settings, Security & access, Personal API keys"

[server]
command = "npx"
args = ["-y", "mcp-remote@0.16.6", "https://mcp.linear.app/mcp", "--transport", "http-only", "--enable-proxy", "--header", "Authorization: Bearer ${LINEAR_API_KEY}"]
hosts = "mcp.linear.app"
