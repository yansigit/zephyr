[package]
name = "zephyr-cursor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cursor AgentService streaming provider for rpi (tools over MCP), loaded by Zephyr"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned with the rpi binary (RPI_PIN); bump both together. The `provider` feature is the
# streaming-provider bridge this crate exports (DESIGN §4.9).
rpi-plugin-sdk = { version = "=0.15.0", features = ["provider"] }
rpi-ai = { version = "=0.15.0", features = ["providers"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
futures-util.workspace = true
base64 = "0.22"
async-trait = "0.1"
# Transport: Cursor's agent endpoint is Connect-over-HTTP/2 with a request body that streams while
# the response streams, which only the low-level h2 client exposes.
bytes = "1"
http = "1"
h2 = "0.4"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
flate2 = "1"
uuid = { version = "1", features = ["v4", "v5"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
