[package]
name = "zephyr"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
publish = false

[dependencies]
tokio = { workspace = true, features = ["io-std"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
libc = "0.2"
base64 = "0.22"
zephyr-policy = { path = "../zephyr-policy" }
rusqlite.workspace = true
toml.workspace = true
toml_edit = "0.25"
unicode-normalization = "0.1"
dialoguer = { version = "0.12", default-features = false, features = ["password"] }
futures-util.workspace = true
# native-tls, not rustls_backend: serenity 0.12.5's rustls path pins rustls-webpki 0.102, which has
# unpatched advisories on the Discord gateway's certificate checks (RUSTSEC-2026-0382, -0098, -0099).
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "http", "native_tls_backend"] }
# OpenSSL for serenity's native-tls, built in statically, so neither the image nor a host CLI copied
# out of it needs a system libssl.
openssl = { version = "0.10", features = ["vendored"] }
hyper = { version = "1", features = ["server", "http1", "client"] }
# Already in the tree through serenity: frames the web app's WebSocket (DESIGN §4.3.3).
tokio-tungstenite = { version = "=0.21.0", default-features = false, features = ["handshake"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
# The token broker (DESIGN §4.21): its CA, and TLS on both legs of a decrypted host. rustls,
# tokio-rustls and webpki-roots are already in the tree through reqwest.
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
subtle = "2"
url = "2"
# Already in the tree (rustls, serenity): TOTP for vault logins (DESIGN §4.15) and the local
# image name of `zephyr packages`.
ring = "0.17.14"
data-encoding = "2.11.1"
croner = { version = "4", default-features = false, features = ["jiff"] }
jiff = "0.2"
# Pinned with the rpi binary (DESIGN §3); bump the two together.
rpi-tui = "=0.29.0"
crossterm = { version = "0.27", features = ["bracketed-paste"] }
# The public suffix list, compiled in: browser pacing's sites are registrable domains (DESIGN §4.24).
psl = "2.1"

[dev-dependencies]
# Already in the tree through rpi-tui: the mascot test checks for ambiguous-width glyphs.
unicode-width = "0.1"
