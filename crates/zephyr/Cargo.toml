[package]
name = "zephyr"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
publish = false

[dependencies]
tokio = { workspace = true, features = ["io-std"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
libc = "0.2"
zephyr-policy = { path = "../zephyr-policy" }
rusqlite.workspace = true
sd-notify.workspace = true
toml.workspace = true
toml_edit = "0.25"
dialoguer = { version = "0.12", default-features = false, features = ["password"] }
futures-util.workspace = true
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "http", "rustls_backend"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
subtle = "2"
url = "2"
croner = { version = "4", default-features = false, features = ["jiff"] }
jiff = "0.2"
# Pinned with the rpi binary (DESIGN §3); bump the two together.
rpi-tui = "=0.12.0"
crossterm = { version = "0.27", features = ["bracketed-paste"] }

[dev-dependencies]
# Already in the tree through rpi-tui: the mascot test checks for ambiguous-width glyphs.
unicode-width = "0.1"
