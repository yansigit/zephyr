# CI's test runner (.github/ci.sh): each test in its own process, one retry so a load flake does not
# fail the run (ci.sh lists it in the job summary), and a hung test killed after 3 minutes.
[profile.ci]
retries = 1
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 3 }
failure-output = "immediate-final"
