[workspace]
members = ["crates/zephyr", "crates/zephyr-policy", "crates/zephyr-discord"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync", "io-util", "signal", "fs", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sd-notify = "0.4"
toml = "0.9"
