[workspace]
members = ["crates/zephyr", "crates/zephyr-cursor", "crates/zephyr-policy"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "MIT"
version = "0.10.0"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync", "io-util", "signal", "fs", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
toml = "0.9"
futures-util = "0.3"
